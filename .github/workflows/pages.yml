name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v6

      - name: Python ortamını hazırla
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Site bağımlılıklarını kur
        run: python -m pip install -r requirements-site.txt

      - name: Site kaynağını hazırla
        run: python scripts/prepare_site.py

      - name: Siteyi derle
        run: python -m mkdocs build --strict --site-dir site

      - name: GitHub Pages ayarlarını hazırla
        uses: actions/configure-pages@v5

      - name: Site paketini yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages yayını
        id: deployment
        uses: actions/deploy-pages@v4
