<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Projenin kullanım kapsamı</title>
  <desc id="desc">Projenin uygun ve uygun olmayan kullanımları.</desc>
  <rect width="1200" height="390" rx="28" fill="#fffaf0"/>
  <text x="70" y="70" fill="#292524" font-family="Arial, sans-serif" font-size="30" font-weight="700">Bu çalışmanın sınırı nerede?</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="110" width="500" height="220" rx="24" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <circle cx="120" cy="160" r="24" fill="#10b981"/><path d="M109 160l8 8 16-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="170" fill="#065f46" font-size="23" font-weight="700">Bu repo ne yapar?</text>
    <text x="110" y="222" fill="#334155" font-size="18">• Radar verisini tanıtır</text>
    <text x="110" y="258" fill="#334155" font-size="18">• Basit model sürecini öğretir</text>
    <text x="110" y="294" fill="#334155" font-size="18">• Hataları ve sınırları gösterir</text>
    <rect x="630" y="110" width="500" height="220" rx="24" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
    <circle cx="680" cy="160" r="24" fill="#e11d48"/><path d="M669 149l22 22m0-22l-22 22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="720" y="170" fill="#9f1239" font-size="23" font-weight="700">Bu repo ne yapmaz?</text>
    <text x="670" y="222" fill="#334155" font-size="18">• Sahada kesin karar vermez</text>
    <text x="670" y="258" fill="#334155" font-size="18">• Sağlık durumu belirlemez</text>
    <text x="670" y="294" fill="#334155" font-size="18">• Uzman değerlendirmesinin yerini almaz</text>
  </g>
</svg>
