<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Rescuer veri toplama düzeni ve X4M200 tanıtımı</title>
  <desc id="desc">X4M200 UWB radarın duvarlı ve duvarsız ortamda yatan kişiden genlik ve faz verisi toplamasını anlatan özgün şema.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243b"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1eb7a5"/>
      <stop offset="1" stop-color="#087b74"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8f1f8}
      .muted{fill:#9fb3c8}
      .card{fill:#102940;stroke:#29465f;stroke-width:2}
      .label{font-size:20px;font-weight:700;letter-spacing:.4px}
      .small{font-size:17px}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1310" cy="70" r="170" fill="#14b8a6" opacity=".08"/>
  <circle cx="80" cy="720" r="190" fill="#f59e0b" opacity=".06"/>

  <text x="64" y="72" class="t" font-size="34" font-weight="800">Rescuer • veri toplama düzeni</text>
  <text x="64" y="105" class="t muted" font-size="18">UWB yansıması → menzil boyunca genlik ve faz → insan var/yok analizi</text>

  <g filter="url(#shadow)">
    <rect x="64" y="145" width="370" height="540" rx="24" class="card"/>
    <text x="96" y="190" class="t label">X4M200 UWB RADAR</text>
    <text x="96" y="219" class="t muted small">Temsili ürün anlatımı</text>

    <rect x="122" y="260" width="254" height="170" rx="18" fill="url(#board)" stroke="#6ee7d8" stroke-width="2"/>
    <rect x="150" y="289" width="76" height="64" rx="8" fill="#082f35" stroke="#77efe0"/>
    <text x="164" y="328" class="t" font-size="18" font-weight="800">X4</text>
    <path d="M264 305h70M264 327h70M264 349h70" stroke="#b7fff5" stroke-width="7" stroke-linecap="round"/>
    <circle cx="159" cy="392" r="9" fill="#f59e0b"/>
    <circle cx="191" cy="392" r="9" fill="#67e8f9"/>
    <circle cx="223" cy="392" r="9" fill="#a7f3d0"/>
    <path d="M122 284h-16m16 30h-16m16 30h-16m16 30h-16M376 284h16m-16 30h16m-16 30h16m-16 30h16" stroke="#77efe0" stroke-width="4"/>

    <g transform="translate(96 474)">
      <rect width="306" height="54" rx="12" fill="#0a1b2c" stroke="#29465f"/>
      <circle cx="27" cy="27" r="8" fill="#14b8a6"/>
      <text x="48" y="34" class="t small">Kamera görüntüsü üretmez</text>
      <rect y="70" width="306" height="54" rx="12" fill="#0a1b2c" stroke="#29465f"/>
      <circle cx="27" cy="97" r="8" fill="#f59e0b"/>
      <text x="48" y="104" class="t small">≈17 ölçüm / saniye</text>
      <rect y="140" width="306" height="54" rx="12" fill="#0a1b2c" stroke="#29465f"/>
      <circle cx="27" cy="167" r="8" fill="#67e8f9"/>
      <text x="48" y="174" class="t small">≈5,14 cm menzil adımı</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="145" width="866" height="390" rx="24" class="card"/>
    <text x="506" y="190" class="t label">DENEY SAHNESİ</text>
    <text x="506" y="219" class="t muted small">0,5–5 m • dört radar konumu • farklı kişi yönelimleri</text>

    <g transform="translate(525 280)">
      <rect x="0" y="58" width="92" height="82" rx="14" fill="#0b7f78" stroke="#6ee7d8" stroke-width="2"/>
      <circle cx="46" cy="99" r="18" fill="#07111f" stroke="#6ee7d8" stroke-width="3"/>
      <path d="M92 76c80-58 145-58 225 0M92 99c82-36 147-36 225 0M92 122c83-14 150-14 225 0" fill="none" stroke="#31d4c1" stroke-width="4" opacity=".78"/>
      <text x="1" y="168" class="t" font-size="17" font-weight="700">X4M200</text>

      <rect x="330" y="0" width="40" height="210" rx="4" fill="#f59e0b"/>
      <path d="M338 15h24M338 45h24M338 75h24M338 105h24M338 135h24M338 165h24M338 195h24" stroke="#ffcf70" stroke-width="4"/>
      <text x="323" y="235" class="t" font-size="16">Duvar opsiyonel</text>

      <path d="M390 77c90-45 165-45 254 0M390 103c90-25 165-25 254 0M390 129c90-7 165-7 254 0" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="9 9" opacity=".82"/>

      <circle cx="735" cy="124" r="27" fill="#e8f1f8"/>
      <path d="M706 151h133c19 0 34 15 34 34v9H670v-9c0-19 17-34 36-34z" fill="#cbd8e6"/>
      <path d="M752 150c16 20 34 29 56 29" fill="none" stroke="#14b8a6" stroke-width="5"/>
      <rect x="645" y="194" width="247" height="14" rx="7" fill="#6b7f92"/>
      <text x="700" y="237" class="t" font-size="17" font-weight="700">Yatan katılımcı</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="565" width="866" height="120" rx="24" class="card"/>
    <text x="506" y="605" class="t label">KAYIT ÇIKTISI</text>
    <g transform="translate(506 627)">
      <rect width="178" height="36" rx="18" fill="#0b7f78"/><text x="33" y="25" class="t small" font-weight="700">Genlik • abs</text>
      <path d="M194 18h58" stroke="#49657d" stroke-width="3"/><path d="m243 10 12 8-12 8" fill="none" stroke="#49657d" stroke-width="3"/>
      <rect x="272" width="178" height="36" rx="18" fill="#3b6483"/><text x="316" y="25" class="t small" font-weight="700">Faz • angle</text>
      <path d="M466 18h58" stroke="#49657d" stroke-width="3"/><path d="m515 10 12 8-12 8" fill="none" stroke="#49657d" stroke-width="3"/>
      <rect x="544" width="270" height="36" rx="18" fill="#b56b08"/><text x="589" y="25" class="t small" font-weight="700">İnsan var / insan yok</text>
    </g>
  </g>
</svg>
