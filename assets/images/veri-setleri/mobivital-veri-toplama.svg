<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">MobiVital veri toplama düzeni</title>
  <desc id="desc">SLMX4 radar, Raspberry Pi, hareket sensörü ve giyilebilir referans sensörlerin zaman eşlemeli veri üretmesini anlatan özgün şema.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#132a43"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".26"/>
    </filter>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8f1f8}
      .m{fill:#9fb3c8}.card{fill:#102940;stroke:#29465f;stroke-width:2}
      .h{font-size:20px;font-weight:750}.sm{font-size:17px}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1235" cy="35" r="210" fill="#14b8a6" opacity=".07"/>
  <text x="64" y="72" class="t" font-size="34" font-weight="800">MobiVital • eş zamanlı solunum ölçümü</text>
  <text x="64" y="105" class="t m" font-size="18">Radar dalgası + platform hareketi + giyilebilir referans</text>

  <g filter="url(#s)">
    <rect x="64" y="145" width="410" height="540" rx="24" class="card"/>
    <text x="96" y="190" class="t h">MOBİL RADAR PLATFORMU</text>
    <g transform="translate(102 236)">
      <rect x="42" y="42" width="250" height="180" rx="20" fill="#0a1b2c" stroke="#31d4c1" stroke-width="3"/>
      <rect x="75" y="76" width="105" height="70" rx="9" fill="#0b7f78"/>
      <text x="91" y="118" class="t" font-size="19" font-weight="800">SLMX4</text>
      <rect x="202" y="75" width="57" height="78" rx="8" fill="#334e68" stroke="#8aa5bc"/>
      <circle cx="230" cy="99" r="8" fill="#f59e0b"/>
      <path d="M211 125h38M211 137h38" stroke="#b8c8d7" stroke-width="4"/>
      <text x="174" y="186" class="t sm" text-anchor="middle">Raspberry Pi + IMU</text>
      <path d="M167 222v82M115 304h104" stroke="#b8c8d7" stroke-width="8" stroke-linecap="round"/>
      <path d="M115 304 77 365M219 304l38 61" stroke="#b8c8d7" stroke-width="8" stroke-linecap="round"/>
      <rect x="42" y="375" width="250" height="52" rx="16" fill="#173c58" stroke="#426783"/>
      <text x="167" y="408" class="t sm" text-anchor="middle" font-weight="700">Tripod veya elde kullanım</text>
    </g>
    <g transform="translate(97 666)">
      <circle cx="10" cy="0" r="7" fill="#14b8a6"/>
      <text x="28" y="6" class="t" font-size="15">Radar 50 Hz • IMU 100 Hz</text>
    </g>
  </g>

  <g filter="url(#s)">
    <rect x="510" y="145" width="826" height="330" rx="24" class="card"/>
    <text x="545" y="190" class="t h">ÖLÇÜM SAHNESİ</text>
    <text x="545" y="219" class="t m sm">Katılımcı yaklaşık 1,5 m uzakta, oturarak normal nefes alır</text>

    <g transform="translate(560 260)">
      <rect x="0" y="55" width="110" height="86" rx="16" fill="#0b7f78" stroke="#6ee7d8" stroke-width="2"/>
      <circle cx="55" cy="98" r="21" fill="#07111f" stroke="#6ee7d8" stroke-width="3"/>
      <path d="M110 78c95-55 175-55 275 0M110 101c96-33 177-33 275 0M110 124c96-12 177-12 275 0" fill="none" stroke="#31d4c1" stroke-width="4"/>
      <text x="18" y="171" class="t sm" font-weight="700">UWB radar</text>
      <path d="M140 198h235" stroke="#f59e0b" stroke-width="3"/>
      <path d="m140 190-14 8 14 8M375 190l14 8-14 8" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <text x="255" y="225" class="t sm" text-anchor="middle">≈1,5 m</text>

      <circle cx="500" cy="55" r="32" fill="#e8f1f8"/>
      <path d="M476 88h54c25 0 45 20 45 45v51h-144v-51c0-25 20-45 45-45z" fill="#cad8e4"/>
      <path d="M492 104c25 14 38 14 62 0" fill="none" stroke="#f59e0b" stroke-width="9"/>
      <path d="M550 123c25 12 36 26 42 52" fill="none" stroke="#67e8f9" stroke-width="6"/>
      <rect x="423" y="184" width="165" height="16" rx="8" fill="#7890a6"/>
      <path d="M445 200v34M567 200v34" stroke="#7890a6" stroke-width="10"/>
      <text x="505" y="204" class="t" font-size="15" text-anchor="middle" font-weight="700">Giyilebilir referanslar</text>
    </g>
  </g>

  <g filter="url(#s)">
    <rect x="510" y="510" width="826" height="175" rx="24" class="card"/>
    <text x="545" y="552" class="t h">ZAMAN EŞLEME VE CSV</text>
    <g transform="translate(545 579)">
      <rect width="170" height="46" rx="13" fill="#0b7f78"/><text x="85" y="30" class="t sm" text-anchor="middle" font-weight="700">120 I + 120 Q</text>
      <rect x="190" width="145" height="46" rx="13" fill="#305772"/><text x="262" y="30" class="t sm" text-anchor="middle" font-weight="700">6 IMU</text>
      <rect x="355" width="195" height="46" rx="13" fill="#9a5b08"/><text x="452" y="30" class="t sm" text-anchor="middle" font-weight="700">Solunum referansı</text>
      <rect x="570" width="176" height="46" rx="13" fill="#7b3f76"/><text x="658" y="30" class="t sm" text-anchor="middle" font-weight="700">Nabız referansı</text>
      <path d="M85 64v27h573V64" fill="none" stroke="#65839d" stroke-width="3"/>
      <text x="372" y="112" class="t sm" text-anchor="middle">Başlıksız CSV • toplam 254 sütun</text>
    </g>
  </g>
</svg>
