<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">OMuSense-23 veri toplama düzeni</title>
  <desc id="desc">IWR1443 mmWave radar ve RGB-D kamera ile üç poz ve dört nefes etkinliğinin kaydedilmesini anlatan özgün şema.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#142b45"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".26"/>
    </filter>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8f1f8}.m{fill:#9fb3c8}
      .card{fill:#102940;stroke:#29465f;stroke-width:2}.h{font-size:20px;font-weight:750}.sm{font-size:17px}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1290" cy="60" r="190" fill="#f59e0b" opacity=".07"/>
  <text x="64" y="72" class="t" font-size="34" font-weight="800">OMuSense-23 • çok modlu nefes ve poz kaydı</text>
  <text x="64" y="105" class="t m" font-size="18">mmWave radar + RGB-D kamera → poz, etkinlik ve biyosinyal dosyaları</text>

  <g filter="url(#s)">
    <rect x="64" y="145" width="380" height="540" rx="24" class="card"/>
    <text x="96" y="190" class="t h">AYNI TRİPODDA İKİ SENSÖR</text>
    <g transform="translate(105 235)">
      <rect x="38" y="0" width="225" height="74" rx="18" fill="#1c3e59" stroke="#67e8f9" stroke-width="2"/>
      <circle cx="91" cy="37" r="16" fill="#07111f" stroke="#67e8f9" stroke-width="3"/>
      <circle cx="151" cy="37" r="16" fill="#07111f" stroke="#67e8f9" stroke-width="3"/>
      <circle cx="211" cy="37" r="16" fill="#07111f" stroke="#67e8f9" stroke-width="3"/>
      <text x="150" y="103" class="t sm" text-anchor="middle" font-weight="700">Intel RealSense D435</text>

      <rect x="48" y="135" width="205" height="155" rx="18" fill="#b6433d" stroke="#ff9c90" stroke-width="2"/>
      <rect x="77" y="168" width="60" height="60" rx="8" fill="#7b2523"/>
      <path d="M167 168h55M167 193h55M167 218h55M85 253h128" stroke="#ffd0c9" stroke-width="7" stroke-linecap="round"/>
      <text x="150" y="321" class="t sm" text-anchor="middle" font-weight="700">TI IWR1443 • 76–81 GHz</text>
      <path d="M150 340v66M92 406h116M92 406l-45 66M208 406l45 66" stroke="#8ea7bb" stroke-width="9" stroke-linecap="round"/>
    </g>
    <text x="254" y="649" class="t m sm" text-anchor="middle">Kamera ≈30 FPS • Radar 20 Hz</text>
  </g>

  <g filter="url(#s)">
    <rect x="480" y="145" width="856" height="270" rx="24" class="card"/>
    <text x="516" y="190" class="t h">ÜÇ SABİT POZ</text>
    <text x="516" y="219" class="t m sm">Her katılımcı sensörlere yaklaşık 1,3 m içinde konumlanır</text>

    <g transform="translate(555 250)">
      <rect width="210" height="120" rx="18" fill="#0a1b2c" stroke="#2f526e"/>
      <circle cx="105" cy="28" r="17" fill="#e8f1f8"/>
      <path d="M105 48v44M105 60l-29 24M105 60l29 24M105 92l-24 24M105 92l24 24" stroke="#e8f1f8" stroke-width="9" stroke-linecap="round"/>
      <text x="105" y="149" class="t sm" text-anchor="middle" font-weight="700">A • Ayakta</text>

      <rect x="250" width="210" height="120" rx="18" fill="#0a1b2c" stroke="#2f526e"/>
      <circle cx="355" cy="28" r="17" fill="#e8f1f8"/>
      <path d="M355 48v39l32 16M355 67l-28 18M387 103h37M424 82v36" stroke="#e8f1f8" stroke-width="9" stroke-linecap="round"/>
      <text x="355" y="149" class="t sm" text-anchor="middle" font-weight="700">B • Oturarak</text>

      <rect x="500" width="210" height="120" rx="18" fill="#0a1b2c" stroke="#2f526e"/>
      <circle cx="560" cy="81" r="17" fill="#e8f1f8"/>
      <path d="M580 81h87M610 81l26-24M667 81l22 24" stroke="#e8f1f8" stroke-width="10" stroke-linecap="round"/>
      <text x="605" y="149" class="t sm" text-anchor="middle" font-weight="700">C • Yatarak</text>
    </g>
  </g>

  <g filter="url(#s)">
    <rect x="480" y="450" width="856" height="235" rx="24" class="card"/>
    <text x="516" y="493" class="t h">DÖRT NEFES ETKİNLİĞİ → BEŞ DOSYA TÜRÜ</text>
    <g transform="translate(516 521)">
      <rect width="172" height="42" rx="21" fill="#0b7f78"/><text x="86" y="27" class="t sm" text-anchor="middle">Normal nefes</text>
      <rect x="188" width="145" height="42" rx="21" fill="#34617e"/><text x="260" y="27" class="t sm" text-anchor="middle">Sesli okuma</text>
      <rect x="349" width="196" height="42" rx="21" fill="#9a5b08"/><text x="447" y="27" class="t sm" text-anchor="middle">Yönlendirilmiş</text>
      <rect x="561" width="191" height="42" rx="21" fill="#7a3f76"/><text x="656" y="27" class="t sm" text-anchor="middle">Nefes tutma</text>

      <path d="M376 58v30M80 88h593" stroke="#66839b" stroke-width="3"/>
      <path d="M80 88v22M228 88v22M376 88v22M524 88v22M673 88v22" stroke="#66839b" stroke-width="3"/>
      <g transform="translate(8 110)">
        <rect width="144" height="48" rx="12" fill="#183a55"/><text x="72" y="31" class="t sm" text-anchor="middle">RADAR</text>
        <rect x="148" width="144" height="48" rx="12" fill="#183a55"/><text x="220" y="31" class="t sm" text-anchor="middle">RGB zamanı</text>
        <rect x="296" width="144" height="48" rx="12" fill="#183a55"/><text x="368" y="31" class="t sm" text-anchor="middle">DEPTH</text>
        <rect x="444" width="144" height="48" rx="12" fill="#183a55"/><text x="516" y="31" class="t sm" text-anchor="middle">rPPG</text>
        <rect x="592" width="144" height="48" rx="12" fill="#183a55"/><text x="664" y="31" class="t sm" text-anchor="middle">TIMER</text>
      </g>
    </g>
  </g>
</svg>
