<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Grid tarama ve hibrit doğrulama akışı</title><desc id="desc">Enkaz üzerinde düzenli tarama noktaları ve radar sonucunun diğer sensörlerle doğrulanması.</desc>
  <rect width="1200" height="520" rx="30" fill="#fffdf7"/><text x="60" y="65" fill="#1c1917" font-family="Arial, sans-serif" font-size="29" font-weight="700">Sahada iki temel fikir</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="105" width="490" height="350" rx="24" fill="#fff" stroke="#e7e5e4" stroke-width="2"/><text x="90" y="150" fill="#0f766e" font-size="18" font-weight="700">1 · DÜZENLİ GRID TARAMASI</text><text x="90" y="181" fill="#57534e" font-size="16">Ölçüm noktaları planlanır ve kaydedilir.</text>
    <g stroke="#cbd5e1" stroke-width="2"><path d="M115 220h370M115 275h370M115 330h370M115 385h370"/><path d="M150 205v200M225 205v200M300 205v200M375 205v200M450 205v200"/></g>
    <g fill="#14b8a6" stroke="#fff" stroke-width="4"><circle cx="150" cy="220" r="11"/><circle cx="300" cy="220" r="11"/><circle cx="450" cy="220" r="11"/><circle cx="225" cy="275" r="11"/><circle cx="375" cy="275" r="11"/><circle cx="150" cy="330" r="11"/><circle cx="300" cy="330" r="11"/><circle cx="450" cy="330" r="11"/><circle cx="225" cy="385" r="11"/><circle cx="375" cy="385" r="11"/></g>
    <rect x="590" y="105" width="550" height="350" rx="24" fill="#0f172a"/><text x="620" y="150" fill="#5eead4" font-size="18" font-weight="700">2 · HİBRİT DOĞRULAMA</text><text x="620" y="181" fill="#cbd5e1" font-size="16">Tek bir sensör yerine kanıtlar birleştirilir.</text>
    <rect x="625" y="220" width="115" height="72" rx="16" fill="#0f766e"/><rect x="765" y="220" width="115" height="72" rx="16" fill="#1d4ed8"/><rect x="905" y="220" width="115" height="72" rx="16" fill="#7c3aed"/>
    <text x="682" y="263" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Radar</text><text x="822" y="252" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Sismik /</text><text x="822" y="273" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">akustik</text><text x="962" y="252" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Kamera /</text><text x="962" y="273" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">termal</text>
    <path d="M740 256h25M880 256h25" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><path d="M822 310v42" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/><rect x="700" y="350" width="245" height="65" rx="18" fill="#f59e0b"/><text x="822" y="390" text-anchor="middle" fill="#1c1917" font-size="19" font-weight="700">Uzman değerlendirmesi</text>
  </g>
</svg>
