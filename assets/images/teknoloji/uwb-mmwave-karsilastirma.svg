<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">UWB ve mmWave görev karşılaştırması</title><desc id="desc">UWB derin tarama, mmWave ise yakın alan ayrıntısı için öne çıkar.</desc>
  <rect width="1200" height="450" rx="28" fill="#f8fafc"/><text x="65" y="67" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">Aynı yarış değil, farklı görevler</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="110" width="430" height="280" rx="26" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><text x="95" y="160" fill="#c2410c" font-size="18" font-weight="700">UWB / GPR YAKLAŞIMI</text><text x="95" y="205" fill="#0f172a" font-size="28" font-weight="700">Derine ulaşmayı önceler</text><text x="95" y="250" fill="#475569" font-size="18">• Moloz ve engel arkasında tarama</text><text x="95" y="288" fill="#475569" font-size="18">• Daha geniş alanı kontrol etme</text><text x="95" y="326" fill="#475569" font-size="18">• Daha sınırlı ayrıntı</text>
    <rect x="710" y="110" width="430" height="280" rx="26" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="745" y="160" fill="#1d4ed8" font-size="18" font-weight="700">mmWAVE YAKLAŞIMI</text><text x="745" y="205" fill="#0f172a" font-size="28" font-weight="700">Yakın alanı ayrıntılandırır</text><text x="745" y="250" fill="#475569" font-size="18">• Kısa mesafede hassas hareket</text><text x="745" y="288" fill="#475569" font-size="18">• Konum, hız ve açı bilgisi</text><text x="745" y="326" fill="#475569" font-size="18">• Yoğun engelde daha fazla zayıflama</text>
    <circle cx="600" cy="245" r="76" fill="#0f172a"/><text x="600" y="232" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">GÖREVE GÖRE</text><text x="600" y="261" text-anchor="middle" fill="#5eead4" font-size="24" font-weight="700">SEÇİM</text><path d="M505 245h-38m228 0h38" stroke="#14b8a6" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
