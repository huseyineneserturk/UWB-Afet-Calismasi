<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Arama kurtarma radar ürün ekosistemi</title><desc id="desc">Doğrudan enkaz radarları ve tamamlayıcı duvar arkası çözümleri.</desc>
  <rect width="1200" height="500" rx="30" fill="#0b1220"/><text x="60" y="63" fill="#f8fafc" font-family="Arial, sans-serif" font-size="29" font-weight="700">Ürünleri görevlerine göre okumak</text><text x="60" y="96" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">Üretici beyanları saha doğrulamasının yerini tutmaz.</text>
  <g font-family="Arial, sans-serif">
    <text x="60" y="137" fill="#fb923c" font-size="16" font-weight="700">DOĞRUDAN ENKAZ / YAŞAM BELİRTİSİ ARAMASI</text>
    <rect x="60" y="158" width="250" height="130" rx="20" fill="#172033"/><rect x="330" y="158" width="250" height="130" rx="20" fill="#172033"/><rect x="600" y="158" width="250" height="130" rx="20" fill="#172033"/><rect x="870" y="158" width="270" height="130" rx="20" fill="#172033"/>
    <text x="85" y="204" fill="#fff" font-size="22" font-weight="700">RescueRadar</text><text x="85" y="242" fill="#cbd5e1" font-size="16">500 MHz UWB/GPR</text><text x="355" y="204" fill="#fff" font-size="22" font-weight="700">LifeLocator TRx</text><text x="355" y="242" fill="#cbd5e1" font-size="16">Çift alıcılı UWB</text><text x="625" y="204" fill="#fff" font-size="22" font-weight="700">LEADER SCAN</text><text x="625" y="242" fill="#cbd5e1" font-size="16">UWB hareket algılama</text><text x="895" y="204" fill="#fff" font-size="22" font-weight="700">RD-400 / DN-IV</text><text x="895" y="242" fill="#cbd5e1" font-size="16">Düşük frekanslı radar</text>
    <text x="60" y="338" fill="#60a5fa" font-size="16" font-weight="700">TAMAMLAYICI VE YAKIN ALAN ÇÖZÜMLERİ</text>
    <rect x="60" y="360" width="340" height="100" rx="20" fill="#102a43"/><rect x="430" y="360" width="340" height="100" rx="20" fill="#102a43"/><rect x="800" y="360" width="340" height="100" rx="20" fill="#102a43"/>
    <text x="88" y="405" fill="#fff" font-size="22" font-weight="700">NASA/JPL FINDER</text><text x="88" y="435" fill="#bae6fd" font-size="15">Mikro-hareket prototipi</text><text x="458" y="405" fill="#fff" font-size="22" font-weight="700">Camero Xaver</text><text x="458" y="435" fill="#bae6fd" font-size="15">Duvar arkası durumsal farkındalık</text><text x="828" y="405" fill="#fff" font-size="22" font-weight="700">TI mmWave</text><text x="828" y="435" fill="#bae6fd" font-size="15">Yakın alan geliştirme platformu</text>
  </g>
</svg>
