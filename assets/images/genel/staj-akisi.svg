<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">UWB afet çalışması proje akışı</title>
  <desc id="desc">Veriyi tanı, senaryoyu düşün, modeli kur ve sonucu yorumla adımları.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e6fffb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="70" y="65" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Çalışmanın kısa yolu</text>
  <text x="70" y="96" fill="#475569" font-family="Arial, sans-serif" font-size="17">Karmaşık görünen süreç, dört anlaşılır adımda ilerliyor.</text>
  <path d="M275 215 H385 M565 215 H675 M855 215 H965" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="220" height="140" rx="22" fill="#ffffff"/>
    <rect x="345" y="145" width="220" height="140" rx="22" fill="#ffffff"/>
    <rect x="635" y="145" width="220" height="140" rx="22" fill="#ffffff"/>
    <rect x="925" y="145" width="220" height="140" rx="22" fill="#0f172a"/>
  </g>
  <circle cx="95" cy="185" r="22" fill="#ccfbf1"/><text x="95" y="193" text-anchor="middle" fill="#0f766e" font-family="Arial" font-size="20" font-weight="700">1</text>
  <circle cx="385" cy="185" r="22" fill="#ffedd5"/><text x="385" y="193" text-anchor="middle" fill="#c2410c" font-family="Arial" font-size="20" font-weight="700">2</text>
  <circle cx="675" cy="185" r="22" fill="#dbeafe"/><text x="675" y="193" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="20" font-weight="700">3</text>
  <circle cx="965" cy="185" r="22" fill="#14b8a6"/><text x="965" y="193" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="20" font-weight="700">4</text>
  <g font-family="Arial, sans-serif">
    <text x="85" y="238" fill="#0f172a" font-size="20" font-weight="700">Veriyi tanı</text><text x="85" y="263" fill="#64748b" font-size="15">Dosyaları ve etiketleri anla</text>
    <text x="375" y="238" fill="#0f172a" font-size="20" font-weight="700">Senaryoyu düşün</text><text x="375" y="263" fill="#64748b" font-size="15">Saha koşullarını canlandır</text>
    <text x="665" y="238" fill="#0f172a" font-size="20" font-weight="700">Modeli kur</text><text x="665" y="263" fill="#64748b" font-size="15">Basit bir başlangıç yap</text>
    <text x="955" y="238" fill="#ffffff" font-size="20" font-weight="700">Sonucu yorumla</text><text x="955" y="263" fill="#cbd5e1" font-size="15">Başarıyı ve sınırları gör</text>
  </g>
</svg>
