<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">UWB radarın yansıma ve veri üretme mantığı</title>
  <desc id="desc">Radar kısa sinyal gönderir, yansımaları dinler ve zaman ile menzilden oluşan bir veri matrisi üretir.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#0D2436"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2DD4BF"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B"/>
    </marker>
    <style>
      .title { font: 700 36px "Segoe UI", Arial, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #94A3B8; }
      .section { font: 700 21px "Segoe UI", Arial, sans-serif; fill: #E2E8F0; }
      .label { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #E2E8F0; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #94A3B8; }
      .card-title { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #5EEAD4; letter-spacing: 1px; }
      .card-text { font: 500 15px "Segoe UI", Arial, sans-serif; fill: #CBD5E1; }
    </style>
  </defs>

  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <rect x="34" y="34" width="1332" height="752" rx="22" fill="#0B1F33" stroke="#1E3A4D"/>

  <text x="76" y="92" class="title">UWB radar bir ölçümü nasıl üretir?</text>
  <text x="76" y="124" class="subtitle">Gönder • Yansımayı dinle • Uzaklığı ayır • Zaman içindeki değişimi izle</text>

  <rect x="72" y="158" width="810" height="342" rx="20" fill="#091A2C" stroke="#1E3A4D"/>
  <text x="98" y="194" class="section">1  Radar ve yansımalar</text>

  <g transform="translate(120 250)">
    <rect x="0" y="22" width="120" height="115" rx="18" fill="#123248" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="38" cy="79" r="21" fill="#071426" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="38" cy="79" r="7" fill="#38BDF8" filter="url(#glow)"/>
    <rect x="72" y="52" width="27" height="54" rx="6" fill="#2DD4BF"/>
    <text x="60" y="167" class="label" text-anchor="middle">UWB radar</text>
  </g>

  <path d="M252 291 C330 247 403 247 479 291" fill="none" stroke="url(#pulse)" stroke-width="7" marker-end="url(#arrow-teal)"/>
  <path d="M252 337 C332 303 404 303 479 337" fill="none" stroke="#2DD4BF" stroke-opacity="0.52" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <text x="360" y="238" class="small" text-anchor="middle">Gönderilen kısa sinyal</text>

  <rect x="500" y="225" width="38" height="210" rx="8" fill="#64748B"/>
  <path d="M500 246 l38 23 -38 23 38 23 -38 23 38 23 -38 23" fill="none" stroke="#94A3B8" stroke-width="4"/>
  <text x="519" y="462" class="label" text-anchor="middle">Duvar</text>

  <g transform="translate(672 225)">
    <circle cx="63" cy="43" r="29" fill="#F59E0B"/>
    <path d="M63 77 C29 77 18 112 24 156 L36 236 H90 L102 156 C108 112 97 77 63 77Z" fill="#F59E0B" opacity="0.84"/>
    <path d="M45 113 C54 101 72 101 81 113 C70 127 56 127 45 113Z" fill="#FDBA74" opacity="0.72"/>
    <text x="63" y="268" class="label" text-anchor="middle">İnsan</text>
  </g>

  <path d="M676 301 C617 266 583 266 543 289" fill="none" stroke="#F59E0B" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <path d="M495 307 C405 365 331 375 254 350" fill="none" stroke="#F59E0B" stroke-opacity="0.86" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <text x="615" y="244" class="small" text-anchor="middle">İnsandan dönen zayıf yansıma</text>
  <text x="375" y="410" class="small" text-anchor="middle">Geri dönüş süresi → yaklaşık uzaklık</text>

  <rect x="910" y="158" width="416" height="342" rx="20" fill="#102A3D" stroke="#1E5361"/>
  <text x="938" y="194" class="section">2  Üç temel bilgi</text>

  <rect x="938" y="222" width="360" height="70" rx="13" fill="#0B1F33"/>
  <text x="960" y="247" class="card-title">MENZİL</text>
  <text x="960" y="272" class="card-text">Yansıma yaklaşık hangi uzaklıktan geldi?</text>

  <rect x="938" y="307" width="360" height="70" rx="13" fill="#0B1F33"/>
  <text x="960" y="332" class="card-title">GENLİK</text>
  <text x="960" y="357" class="card-text">Geri dönen yansıma ne kadar güçlü?</text>

  <rect x="938" y="392" width="360" height="70" rx="13" fill="#0B1F33"/>
  <text x="960" y="417" class="card-title">FAZ</text>
  <text x="960" y="442" class="card-text">Dalga çevrimin hangi konumunda?</text>

  <rect x="72" y="528" width="1254" height="218" rx="20" fill="#091A2C" stroke="#1E3A4D"/>
  <text x="98" y="565" class="section">3  Tek ölçüm değil, zaman × menzil tablosu</text>

  <g transform="translate(105 595)">
    <text x="-10" y="16" class="small" text-anchor="end">zaman</text>
    <text x="335" y="132" class="small" text-anchor="middle">yakın ← menzil noktaları → uzak</text>
    <g fill="#123248" stroke="#244055">
      <rect x="0" y="0" width="80" height="28"/><rect x="80" y="0" width="80" height="28"/><rect x="160" y="0" width="80" height="28"/><rect x="240" y="0" width="80" height="28"/><rect x="320" y="0" width="80" height="28"/><rect x="400" y="0" width="80" height="28"/><rect x="480" y="0" width="80" height="28"/><rect x="560" y="0" width="80" height="28"/>
      <rect x="0" y="28" width="80" height="28"/><rect x="80" y="28" width="80" height="28"/><rect x="160" y="28" width="80" height="28"/><rect x="240" y="28" width="80" height="28"/><rect x="320" y="28" width="80" height="28"/><rect x="400" y="28" width="80" height="28"/><rect x="480" y="28" width="80" height="28"/><rect x="560" y="28" width="80" height="28"/>
      <rect x="0" y="56" width="80" height="28"/><rect x="80" y="56" width="80" height="28"/><rect x="160" y="56" width="80" height="28"/><rect x="240" y="56" width="80" height="28"/><rect x="320" y="56" width="80" height="28"/><rect x="400" y="56" width="80" height="28"/><rect x="480" y="56" width="80" height="28"/><rect x="560" y="56" width="80" height="28"/>
      <rect x="0" y="84" width="80" height="28"/><rect x="80" y="84" width="80" height="28"/><rect x="160" y="84" width="80" height="28"/><rect x="240" y="84" width="80" height="28"/><rect x="320" y="84" width="80" height="28"/><rect x="400" y="84" width="80" height="28"/><rect x="480" y="84" width="80" height="28"/><rect x="560" y="84" width="80" height="28"/>
    </g>
    <g fill="#2DD4BF">
      <rect x="320" y="0" width="80" height="28" opacity="0.30"/>
      <rect x="320" y="28" width="80" height="28" opacity="0.80"/>
      <rect x="320" y="56" width="80" height="28" opacity="0.42"/>
      <rect x="320" y="84" width="80" height="28" opacity="0.92"/>
    </g>
    <text x="360" y="-12" class="small" text-anchor="middle">değişen bölge</text>
  </g>

  <path d="M792 650 L900 650" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <rect x="930" y="590" width="340" height="116" rx="16" fill="#102A3D" stroke="#1E5361"/>
  <text x="955" y="619" class="card-title">MODELİN GÖRDÜĞÜ</text>
  <text x="955" y="649" class="card-text">10 saniyelik değişim özeti</text>
  <text x="955" y="676" class="card-text">→ insan var / yok tahmini</text>

  <text x="700" y="779" class="small" text-anchor="middle">Bu şema öğretim amaçlıdır; gerçek dalga yolları ve yansımalar daha karmaşıktır.</text>
</svg>
